<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт с мини-играми</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="hero">
            <div class="hero__content container">
                <h1 class="hero__title">Добро пожаловать<br>на мой сайт мини-игр</h1>
                <p class="hero__text">
                    Тебе предстоит пройти несколько увлекательных игр.<br>
                    Если готов, нажимай <strong>«Поехали!»</strong> и <strong>приступай</strong>.
                </p>
                <a class="hero__button" href="#games">Поехали!</a>
            </div>

            <div class="hero__decorations" aria-hidden="true">
                <img class="hero__decor hero__decor--right" src="img/decor-right.svg" alt="">
                <img class="hero__decor hero__decor--star-1" src="img/star-medium.svg" alt="">
                <img class="hero__decor hero__decor--star-2" src="img/star-outline.svg" alt="">
                <img class="hero__decor hero__decor--star-3" src="img/star-small.svg" alt="">
                <img class="hero__decor hero__decor--star-4" src="img/star-large.svg" alt="">
            </div>

            <div class="ticker" aria-label="Список мини-игр">
                <div class="ticker__content">
                    <span>ВИКТОРИНА</span><span>✦</span>
                    <span>УГАДАЙ ЧИСЛО</span><span>✦</span>
                    <span>ПЕРЕВЕРНИ ТЕКСТ</span><span>✦</span>
                    <span>ПРОСТАЯ АРИФМЕТИКА</span><span>✦</span>
                    <span>КАМЕНЬ, НОЖНИЦЫ, БУМАГА</span><span>✦</span>
                    <span>ГЕНЕРАТОР СЛУЧАЙНЫХ ЦВЕТОВ</span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
